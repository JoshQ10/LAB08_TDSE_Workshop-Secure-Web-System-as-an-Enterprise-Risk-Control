<VirtualHost *:80>
    ServerName joshua-risk-lab.duckdns.org
    DocumentRoot /var/www/enterprise-risk-frontend

    # Server-level rewrite engine: required for the HTTP->HTTPS redirect that Certbot
    # appends to this virtual host (the one inside <Directory> only applies there).
    RewriteEngine On

    <Directory /var/www/enterprise-risk-frontend>
        Options -Indexes
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8080/api/
    ProxyPassReverse /api/ http://127.0.0.1:8080/api/
    RequestHeader set X-Forwarded-Proto "http"
</VirtualHost>
